# The daemon runs as the logged-in user but its socket must live somewhere polkit's helper
# can reach: polkit.service sets PrivateTmp=yes and ProtectHome=yes, so /tmp, /var/tmp and
# /run/user/<uid> are all invisible to it. /run is not.
#
# Spike: the owner is hardcoded. The shipping daemon runs as its own `kpasskey` system
# user created by sysusers.d, and this becomes `d /run/kpasskey 0755 kpasskey kpasskey -`.
d /run/kpasskey 0755 iharob iharob -
