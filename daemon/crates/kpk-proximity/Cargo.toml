[package]
name = "kpk-proximity"
# Literal, not version.workspace: release-please rewrites the scalar at package.version
# and fails outright on a dotted `version.workspace = true`. Both members move together.
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
zbus.workspace = true
tokio.workspace = true
anyhow.workspace = true
rand.workspace = true

[[bin]]
name = "kpk-ble-selftest"
path = "src/bin/selftest.rs"
